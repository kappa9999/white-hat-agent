validation:
  fixture_ids: [swagger-typescript-api-local-differential-2026-07-29]
  test_commands:
    - npx vitest run tests/route-path-injection.test.ts tests/escape-js-template-literal-with-path-params.test.ts tests/resolved-swagger-schema-ssrf.test.ts --reporter=verbose
    - pytest tests/test_corpus.py
  known_limitations:
    - Validation reproduced two published advisories on one Linux and Node runtime with exact npm artifacts; it is not a claim about every generator or platform.
    - The generated-output sentinel was never executed, so the local evidence confirms syntax treatment rather than independently re-demonstrating advisory impact.
    - The local external-reference matrix covered a direct cross-origin IPv4 loopback reference; broader redirect, DNS, IPv6, and same-origin policy cases were covered only by upstream regression tests.
  last_validated_at: 2026-07-29T15:37:41Z
  validated_by: [white-hat-agent-local-differential-2026-07-29]
