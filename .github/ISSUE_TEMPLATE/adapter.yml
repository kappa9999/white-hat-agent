name: Capability or adapter proposal
description: Propose a provider-neutral capability or a concrete tool adapter.
title: "[adapter]: "
labels: [adapter, needs-triage]
body:
  - type: input
    id: capability
    attributes:
      label: Capability ID or proposed ID
      placeholder: binary.diff
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Observable contract
      description: Inputs, outputs, errors, bounds, truncation, side effects, cleanup, and exact identity.
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Highest execution class
      options: [analysis, read-only, controlled-active, state-changing, high-impact]
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Concrete implementation or tools
      description: Optional provider/tool details, transports, platforms, authentication, and isolation.
  - type: textarea
    id: tests
    attributes:
      label: Conformance and integration tests
      description: Include negative, timeout, malformed, scope-mismatch, cleanup, and target-drift cases.
    validations:
      required: true
