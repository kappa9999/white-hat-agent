name: Bug report
description: Report reproducible incorrect behavior without sensitive details.
title: "[bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Use private vulnerability reporting for security-sensitive bugs.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, uv, install method, transport, and relevant configuration without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and bounded logs
    validations:
      required: true
