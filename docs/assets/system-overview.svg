<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
  <title id="title">White Hat Agent system flow</title>
  <desc id="desc">Community knowledge, exact campaign context, and agent capabilities flow through four readable stages: knowledge and trust, composition and planning, fleet dispatch and discovery, and evidence verification. Verified findings and reusable learning are produced, with reviewed learning returning to the corpus.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 1.6px; }
      .card-title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 19px; fill: #334155; }
      .stage-title { font-size: 25px; font-weight: 750; fill: #0f172a; }
      .stage-body { font-size: 20px; fill: #334155; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="1258" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M29 1 H1171 A28 28 0 0 1 1199 29 V132 H1 V29 A28 28 0 0 1 29 1 Z" fill="url(#header)"/>
  <text class="font" x="600" y="50" text-anchor="middle" font-size="39" font-weight="760" fill="#ffffff">From shared knowledge to verified capability</text>
  <text class="font" x="600" y="84" text-anchor="middle" font-size="18" fill="#cbd5e1">
    <tspan x="600" dy="0">Explicit scope  •  typed execution</tspan>
    <tspan x="600" dy="25">Durable evidence  •  reusable learning</tspan>
  </text>

  <text class="font eyebrow" x="60" y="169" fill="#475569">INPUTS</text>

  <g filter="url(#shadow)">
    <rect x="60" y="192" width="330" height="154" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="60" y="192" width="8" height="154" rx="4" fill="#2563eb"/>
    <text class="font card-title" x="88" y="230">Community knowledge</text>
    <text class="font body" x="88" y="267">
      <tspan x="88" dy="0">Plain-language methods</tspan>
      <tspan x="88" dy="29">Reports, standards, field notes</tspan>
      <tspan x="88" dy="29">Any language + provenance</tspan>
    </text>

    <rect x="435" y="192" width="330" height="154" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="435" y="192" width="8" height="154" rx="4" fill="#7c3aed"/>
    <text class="font card-title" x="463" y="230">Campaign context</text>
    <text class="font body" x="463" y="267">
      <tspan x="463" dy="0">Exact scope and targets</tspan>
      <tspan x="463" dy="29">Objectives and budgets</tspan>
      <tspan x="463" dy="29">Opportunity priorities</tspan>
    </text>

    <rect x="810" y="192" width="330" height="154" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="810" y="192" width="8" height="154" rx="4" fill="#0f766e"/>
    <text class="font card-title" x="838" y="230">Agent capabilities</text>
    <text class="font body" x="838" y="267">
      <tspan x="838" dy="0">Models and tools</tspan>
      <tspan x="838" dy="29">Typed adapter contracts</tspan>
      <tspan x="838" dy="29">Execution ceilings</tspan>
    </text>
  </g>

  <path d="M225 346 V385 H600 V414" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M600 346 V414" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M975 346 V385 H600" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="font eyebrow" x="220" y="409" fill="#475569">WHITE HAT AGENT CORE</text>

  <g filter="url(#shadow)">
    <rect x="220" y="434" width="800" height="128" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="278" cy="498" r="30" fill="#2563eb"/>
    <text class="font" x="278" y="507" text-anchor="middle" font-size="25" font-weight="750" fill="#ffffff">1</text>
    <text class="font stage-title" x="330" y="468">Knowledge + trust</text>
    <text class="font stage-body" x="330" y="500">
      <tspan x="330" dy="0">Preserve source and provenance.</tspan>
      <tspan x="330" dy="25">Compile strict playbooks.</tspan>
      <tspan x="330" dy="25">Promote each version through review.</tspan>
    </text>

    <rect x="220" y="594" width="800" height="128" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="278" cy="658" r="30" fill="#7c3aed"/>
    <text class="font" x="278" y="667" text-anchor="middle" font-size="25" font-weight="750" fill="#ffffff">2</text>
    <text class="font stage-title" x="330" y="628">Compose + plan</text>
    <text class="font stage-body" x="330" y="660">
      <tspan x="330" dy="0">Chain semantic artifacts.</tspan>
      <tspan x="330" dy="25">Match declared capabilities.</tspan>
      <tspan x="330" dy="25">Emit scoped, budgeted campaign stages.</tspan>
    </text>

    <rect x="220" y="754" width="800" height="128" rx="22" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
    <circle cx="278" cy="818" r="30" fill="#0f766e"/>
    <text class="font" x="278" y="827" text-anchor="middle" font-size="25" font-weight="750" fill="#ffffff">3</text>
    <text class="font stage-title" x="330" y="796">Dispatch + discover</text>
    <text class="font stage-body" x="330" y="832">
      <tspan x="330" dy="0">Lease typed work to compatible agents.</tspan>
      <tspan x="330" dy="27">Execute through explicit external adapters.</tspan>
    </text>

    <rect x="220" y="914" width="800" height="128" rx="22" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="278" cy="978" r="30" fill="#d97706"/>
    <text class="font" x="278" y="987" text-anchor="middle" font-size="25" font-weight="750" fill="#ffffff">4</text>
    <text class="font stage-title" x="330" y="948">Verify + remember</text>
    <text class="font stage-body" x="330" y="980">
      <tspan x="330" dy="0">Bind immutable evidence.</tspan>
      <tspan x="330" dy="25">Test causal and differential claims.</tspan>
      <tspan x="330" dy="25">Retain negative results for replanning.</tspan>
    </text>
  </g>

  <path d="M600 562 V582" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M600 722 V742" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M600 882 V902" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M600 1042 V1070" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="1086" width="800" height="104" rx="22" fill="#0f172a"/>
    <text class="font" x="600" y="1125" text-anchor="middle" font-size="25" font-weight="750" fill="#ffffff">Verified outputs</text>
    <text class="font" x="600" y="1155" text-anchor="middle" font-size="18" fill="#cbd5e1">
      <tspan x="600" dy="0">Reproducible findings  •  reusable learning</tspan>
      <tspan x="600" dy="25">Evidence-backed reports</tspan>
    </text>
  </g>

  <path d="M220 1138 H148 Q110 1138 110 1100 V515 Q110 478 148 478 H204" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow-teal)"/>
  <g transform="translate(88 808) rotate(-90)">
    <rect x="-114" y="-22" width="228" height="44" rx="22" fill="#ccfbf1" stroke="#5eead4"/>
    <text class="font" x="0" y="7" text-anchor="middle" font-size="17" font-weight="700" fill="#115e59">REVIEWED LEARNING RETURNS</text>
  </g>

  <text class="font" x="600" y="1230" text-anchor="middle" font-size="17" fill="#64748b">Models and tools can change. Durable state does not.</text>
</svg>
